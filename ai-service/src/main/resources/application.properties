# Aplicación
spring.application.name=ai-service

server.port=8083

# Ollama
spring.ai.ollama.base-url=http://localhost:11434

# Modelo de chat
spring.ai.ollama.chat.model=qwen3:4b

# Modelo de embeddings
spring.ai.ollama.embedding.model=nomic-embed-text

# PostgreSQL con pgvector
spring.datasource.url=jdbc:postgresql://localhost:5433/enterprise_ai_vectors
spring.datasource.username=postgres
spring.datasource.password=${VECTOR_DB_PASSWORD:postgres}

# Configuración de pgvector
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768

# Comunicación con document-service
document.service.url=${DOCUMENT_SERVICE_URL:http://localhost:8082}