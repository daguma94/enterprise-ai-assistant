apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-ai-api-gateway
  template:
    metadata:
      labels:
        app: enterprise-ai-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: enterprise-ai-api-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: USER_SERVICE_URL
              value: http://enterprise-ai-user-service:8081
            - name: DOCUMENT_SERVICE_URL
              value: http://enterprise-ai-document-service:8082
            - name: AI_SERVICE_URL
              value: http://enterprise-ai-ai-service:8083
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-api-gateway
spec:
  type: NodePort
  selector:
    app: enterprise-ai-api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30082