apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-ai-user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-ai-user-service
  template:
    metadata:
      labels:
        app: enterprise-ai-user-service
    spec:
      containers:
        - name: user-service
          image: enterprise-ai-user-service:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://enterprise-ai-user-db:5432/enterprise_ai_users
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-ai-user-service
spec:
  selector:
    app: enterprise-ai-user-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP